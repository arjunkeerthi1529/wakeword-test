<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scam Guard</title>
<style>
  :root {
    --bg: #f4f5f7; --surface: #ffffff; --text: #16181d; --muted: #5c6370; --line: #dfe2e8;
    --accent: #1f6feb; --on-accent: #ffffff;
    --warn-bg: #fdeceb; --warn-line: #d93025; --warn-text: #8c1a12;
    --watch-bg: #fff4dc; --watch-line: #d98e04; --watch-text: #6b4600;
    --ok: #1e8e3e; --bad: #d93025;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116; --surface: #171b22; --text: #e8eaed; --muted: #9aa3b2; --line: #2a303a;
      --accent: #4c8dff; --on-accent: #07101f;
      --warn-bg: #3a1714; --warn-line: #ff6b61; --warn-text: #ffd6d2;
      --watch-bg: #3a2c0c; --watch-line: #f0b429; --watch-text: #ffe7a8;
      --ok: #5bd17e; --bad: #ff6b61;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  h1 { font-size: 1.15rem; margin: 0; }
  .pill { font-size: .8rem; font-weight: 600; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface); color: var(--muted); white-space: nowrap; }
  .pill.live { color: var(--ok); border-color: var(--ok); }
  .pill.lost { color: var(--bad); border-color: var(--bad); }
  button#toggle { width: 100%; min-height: 56px; font: inherit; font-weight: 700; font-size: 1.05rem;
    border: 0; border-radius: 14px; background: var(--accent); color: var(--on-accent); cursor: pointer; }
  button#toggle.stop { background: var(--bad); color: #fff; }
  button#toggle:disabled { opacity: .5; }
  .banner { margin-top: 12px; padding: 10px 12px; border-radius: 10px; font-size: .92rem;
    background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
  .banner.err { color: var(--bad); border-color: var(--bad); }
  .banner[hidden] { display: none; }
  .checked { margin: 10px 2px 0; font-size: .85rem; color: var(--muted); }
  .checked[hidden] { display: none; }
  #idle-note { margin-top: 12px; color: var(--muted); font-size: .92rem; }
  #alerts { margin-top: 14px; display: grid; gap: 10px; }
  .card { border: 2px solid; border-radius: 14px; padding: 12px 14px; }
  .card.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-text); }
  .card.watch { background: var(--watch-bg); border-color: var(--watch-line); color: var(--watch-text); }
  .card h2 { font-size: 1rem; margin: 0 0 6px; }
  .card blockquote { margin: 6px 0; padding-left: 10px; border-left: 3px solid currentColor; font-style: italic; }
  .card p { margin: 4px 0; }
  .card .meta { font-size: .82rem; opacity: .85; }
  h3 { font-size: .85rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 20px 0 8px; }
  #transcript { background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 6px 12px; max-height: 45vh; overflow-y: auto; }
  #transcript .line { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: .95rem; }
  #transcript .line:last-child { border-bottom: 0; }
  #transcript .t { color: var(--muted); font-size: .78rem; margin-right: 6px; font-variant-numeric: tabular-nums; }
  #transcript .empty { color: var(--muted); padding: 10px 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Scam Guard</h1>
    <span id="pill" class="pill">Connecting…</span>
  </header>

  <button id="toggle" disabled>Listen to this call</button>
  <div id="banner" class="banner" hidden></div>
  <p id="checked" class="checked" hidden></p>
  <p id="idle-note">Put the phone on speakerphone next to the Pi, then tap Listen. Audio and analysis stay on the Pi.</p>

  <section id="alerts" aria-live="assertive"></section>

  <h3>Live transcript</h3>
  <div id="transcript"><div class="empty">Nothing yet.</div></div>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const pill = $("pill"), toggle = $("toggle"), banner = $("banner"), idleNote = $("idle-note");
  const alertsEl = $("alerts"), transcriptEl = $("transcript"), checkedEl = $("checked");
  const OUTCOME = { none: "no warning raised", warn: "warning raised", watch: "caution raised",
                    advice: "safety advice, ignored", invalid: "reply unclear" };

  function showCheck(c) {
    if (!c) { checkedEl.hidden = true; return; }
    checkedEl.hidden = false;
    checkedEl.textContent = "Analyzed through " + c.segment_id + " in " + c.took_s + " s: " +
      (OUTCOME[c.outcome] || c.outcome) + ". Not a guarantee that a call is safe.";
  }

  let ws = null, connected = false, active = false, lastEventId = 0, pingTimer = null, wakeLock = null, failures = 0;
  const cards = new Map();

  function setBanner(text, isErr) {
    banner.hidden = !text;
    banner.textContent = text || "";
    banner.classList.toggle("err", !!isErr);
  }

  function renderState() {
    toggle.disabled = !connected;
    toggle.textContent = active ? "Stop listening" : "Listen to this call";
    toggle.classList.toggle("stop", active);
    idleNote.hidden = active;
    if (!connected) { pill.textContent = "Connection lost"; pill.className = "pill lost"; }
    else if (active) { pill.textContent = "Listening"; pill.className = "pill live"; }
    else { pill.textContent = "Not listening"; pill.className = "pill"; }
  }

  function fmt(ms) {
    const s = Math.floor(ms / 1000);
    return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }

  function clearCall() {
    cards.clear(); alertsEl.textContent = ""; showCheck(null);
    transcriptEl.textContent = "";
    const e = document.createElement("div"); e.className = "empty"; e.textContent = "Nothing yet.";
    transcriptEl.appendChild(e);
  }

  function addLine(seg) {
    const empty = transcriptEl.querySelector(".empty");
    if (empty) empty.remove();
    const row = document.createElement("div"); row.className = "line";
    const t = document.createElement("span"); t.className = "t"; t.textContent = fmt(seg.start_ms);
    row.appendChild(t); row.appendChild(document.createTextNode(seg.text));
    transcriptEl.appendChild(row);
    transcriptEl.scrollTop = transcriptEl.scrollHeight;
  }

  function upsertCard(a) {
    let card = cards.get(a.segment_id);
    const isNew = !card;
    if (isNew) { card = document.createElement("div"); cards.set(a.segment_id, card); alertsEl.prepend(card); }
    card.className = "card " + (a.risk === "warn" ? "warn" : "watch");
    card.textContent = "";
    const h = document.createElement("h2");
    h.textContent = a.risk === "warn" ? "Possible scam request" : "Be careful";
    card.appendChild(h);
    if (a.evidence) { const q = document.createElement("blockquote"); q.textContent = "“" + a.evidence + "”"; card.appendChild(q); }
    const m = document.createElement("p"); m.textContent = a.message; card.appendChild(m);
    const who = a.speaker === "caller" ? "Likely the caller" : a.speaker === "user" ? "Likely you" : "Speaker unclear";
    const meta = document.createElement("p"); meta.className = "meta";
    meta.textContent = who + " · " + (a.source === "llm" ? "analyzed on the Pi" : "heard on the Pi");
    card.appendChild(meta);
  }

  function handle(ev) {
    if (ev.type === "status" && ev.segments !== undefined) {
      lastEventId = 0; clearCall();
      active = !!ev.active;
      ev.segments.forEach(addLine); ev.alerts.forEach(upsertCard); showCheck(ev.last_check);
      setBanner(ev.audio_gap ? "Microphone is not delivering audio. Monitoring may be incomplete." : "", ev.audio_gap);
      renderState(); return;
    }
    if (ev.event_id && ev.event_id <= lastEventId) return;
    if (ev.event_id) lastEventId = ev.event_id;

    switch (ev.type) {
      case "listening": clearCall(); active = true; setBanner(""); acquireWakeLock(); break;
      case "transcript": addLine(ev); break;
      case "checked": showCheck(ev); break;
      case "processing": setBanner(ev.active ? "Analyzing on Raspberry Pi…" : (ev.message || ""), !ev.active && !!ev.message); break;
      case "warning":
        upsertCard(ev);
        if (ev.vibrate && navigator.vibrate) navigator.vibrate([400, 150, 400]);
        break;
      case "stopped": {
        active = false; releaseWakeLock();
        const why = { user: "Monitoring stopped.", max_session: "Monitoring stopped: maximum session length reached.",
                      connection_lost: "Monitoring stopped: phone was disconnected." }[ev.reason] || "Monitoring stopped.";
        setBanner(why, ev.reason !== "user"); break;
      }
      case "error": setBanner(ev.message, true); break;
      case "status": setBanner(ev.message || ""); break;
    }
    renderState();
  }

  async function acquireWakeLock() {
    try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
  }
  function releaseWakeLock() { try { if (wakeLock) wakeLock.release(); } catch (e) {} wakeLock = null; }

  function connect() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(proto + "://" + location.host + "/events");
    ws.onopen = () => { connected = true; failures = 0; setBanner(""); renderState(); pingTimer = setInterval(() => { try { ws.send("ping"); } catch (e) {} }, 15000); };
    ws.onmessage = (m) => { try { handle(JSON.parse(m.data)); } catch (e) {} };
    ws.onclose = () => {
      connected = false; clearInterval(pingTimer); renderState();
      if (++failures >= 3) setBanner("The page loaded but the live connection to the Pi keeps failing. On the Pi run: pip install websockets, then restart the app. Also check the Pi log.", true);
      setTimeout(connect, 2000);
    };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  }

  toggle.addEventListener("click", async () => {
    toggle.disabled = true;
    try {
      const r = await fetch(active ? "/stop" : "/start", { method: "POST" });
      if (!r.ok) { const d = await r.json().catch(() => ({})); setBanner(d.detail || "Request failed.", true); }
    } catch (e) { setBanner("Could not reach the Pi.", true); }
    renderState();
  });

  document.addEventListener("visibilitychange", () => { if (!document.hidden && active) acquireWakeLock(); });

  renderState();
  connect();
})();
</script>
</body>
</html>
