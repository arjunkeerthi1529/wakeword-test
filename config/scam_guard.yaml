# Standalone scam-call warning service — run with:  python -m src.scam
# Then open http://<pi-ip>:8000 on the phone and tap "Listen to this call".

host: 0.0.0.0
port: 8000

# Whisper decodes a fixed 30 s window per chunk, so the cost per chunk is roughly constant:
# on a Pi 4, small.en takes ~10-20 s per chunk (far too slow for live), base.en ~3 s, tiny.en ~1 s.
# Choose the most accurate model whose logged "STT rtf" stays below 1 (see scripts/stt_bench.py).
# Quick A/B without editing this file:  STT_MODEL=small.en python -m src.scam
stt_model: base.en
stt_threads: 4             # 0 = library default
stt_beam_size: 1

llm_base_url: http://localhost:8080

led_pin: 22                # warning LED (GPIO). 0 disables. Must not be held by another process.
mic_device: ""             # "" = system default input; with the assistant running, make that a dsnoop device

# JSON-lines record of transcripts, rule results, LLM prompts/replies and timings, for testing.
# Stores what was said (text), never audio. Set to "" to disable. Summarise with scripts/scam_log_report.py.
analysis_log: logs/scam_events.jsonl

chunk_target_s: 5          # past this length even a short pause cuts a chunk (only when STT is free)
chunk_max_s: 10            # hard cut even without a pause
overlap_s: 0.3             # audio carried into the next chunk after a hard cut
silence_thresh: 0.012
pause_s: 0.9               # silence that ends a chunk shorter than chunk_target_s (longer = fewer half-sentences)
short_pause_s: 0.5         # silence that ends a chunk once it is past chunk_target_s

# false = rely only on the LLM. The rules still run and are recorded in the log as
# "shadow" results (what they would have said) so the two can be compared afterwards.
rules_enabled: false

# Independent of the switch above: ignore an LLM warning when the line only mentions a code/PIN/
# password inside a refusal or safety advice ("don't share your OTP with anyone").
llm_advice_veto: true
# Worked examples in the LLM prompt. More = more accurate on a small model but a longer prompt,
# and prompt processing is the slow part on a Pi. Try 8 or 0 if reviews are too slow.
llm_examples: 16
llm_cadence_s: 10          # send new speech to the LLM every 10 s (next one waits if the previous is still running)
llm_max_tokens: 12         # reply is one short line like "warn s4 caller" (~5 tokens)
llm_timeout_s: 90
max_session_s: 1800
