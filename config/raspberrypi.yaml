platform: raspberrypi

# whisper.cpp binary compiled on Pi ARM — see setup_pi.sh for build steps.
# tiny.en-q5_1 uses ~40 MB RAM and transcribes a 5s utterance in ~0.8-1.5s on Pi 4.
# faster-whisper model — auto-downloads on first run (~250MB for small.en)
# options: tiny.en (~40MB, fast), base.en (~150MB), small.en (~250MB, recommended)
stt_model_name: small.en

# llama.cpp server — already running with Qwen model.
# Start with: ./llama-server -m <model.gguf> --port 8080
# No Ollama needed.
llm_base_url: http://localhost:8080

# Piper TTS — low quality voice is faster and lighter on Pi CPU.
# Download: bash scripts/download_models.sh
piper_voice: models/piper/en_US-lessac-low.onnx

wake_word:
  model: hey_jarvis
  threshold: 0.35
  backend: onnx           # set to "auto" if onnx init fails on Python 3.13

gpio:
  mute_button_pin: 17
  listening_led_pin: 27
  online_led_pin: 22

# Live scam-call warning. When enabled, a small web server starts on the Pi;
# open http://<pi-ip>:8000 on the phone and tap "Listen to this call".
# The assistant pauses while a call is being monitored and resumes on Stop.
spam_guard:
  enabled: true
  host: 0.0.0.0
  port: 8000
  stt_beam_size: 2        # drop to 1 if the logged STT real-time factor goes above 1
  chunk_target_s: 4       # past this length even a short pause cuts a chunk
  chunk_max_s: 6          # hard cut even without a pause
  overlap_s: 0.3          # audio carried into the next chunk after a hard cut
  silence_thresh: 0.012
  pause_s: 0.6            # pause that cuts a chunk shorter than chunk_target_s
  llm_cadence_s: 10       # routine LLM review at most this often
  llm_max_tokens: 120     # JSON reply; too low truncates it and the verdict is lost
  llm_timeout_s: 60
  max_session_s: 1800

# Append per-turn latency rows to latency_log.csv alongside this process.
# Set false to disable CSV logging (table still prints to terminal).
log_latency_csv: true
